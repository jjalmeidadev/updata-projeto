services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: updata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d updata"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    mem_limit: 128m
    cpus: 0.5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    env_file:
      - ./config/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: updata
      DB_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    mem_limit: 128m
    cpus: 0.5

  frontend:
    build:
      context: ./src/presentation/web
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network
    mem_limit: 128m
    cpus: 0.5

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge