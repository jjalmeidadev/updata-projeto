version: "3.9"

services:

  backend:
    image: anagarden007/backend:latest
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=96
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - app_net_prod
    mem_limit: 64m

  worker:
    image: anagarden007/backend:latest
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=96
    command: ["node", "dist/worker.cjs"]
    networks:
      - app_net_prod
    mem_limit: 64m

  frontend:
    image: anagarden007/frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"
    networks:
      - app_net_prod
    mem_limit: 32m

networks:
  app_net_prod:
    driver: bridge