services:
  db:
    image: postgres:16-alpine
    container_name: g05-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: equiem_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - g05-network-dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.dev
    container_name: g05-backend-dev
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: equiem_db
      DB_SSL: "false"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - g05-network-dev

  frontend:
    build:
      context: ./src/presentation/web
      dockerfile: Dockerfile.frontend.dev
    container_name: g05-frontend-dev
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:4200"
    volumes:
      - ./src/presentation/web:/app
      - /app/node_modules
    networks:
      - g05-network-dev

volumes:
  postgres_data_dev:

networks:
  g05-network-dev:
    driver: bridge