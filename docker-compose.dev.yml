services:
  database:
    image: postgres:16-alpine
    container_name: g05-database-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: g05-backend-dev
    restart: unless-stopped
    depends_on:
      - database
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: postgres
      DB_SSL: "false"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    networks:
      - app-network

  frontend:
    build:
      context: ./src/presentation/web
      dockerfile: Dockerfile.dev
    container_name: g05-frontend-dev
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:4200"
    volumes:
      - ./src/presentation/web:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app-network

volumes:
  postgres_data_dev:
  backend_node_modules:
  frontend_node_modules:

networks:
  app-network:
    driver: bridge
