services:
  db:
    image: postgres:16-alpine
    container_name: g05_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: g05db
      POSTGRES_USER: g05user
      POSTGRES_PASSWORD: g05pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g05user -d g05db"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    networks:
      - g05_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: g05_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: g05user
      DB_PASSWORD: g05pass
      DB_DATABASE: g05db
      DB_SSL: "false"
    ports:
      - "4000:3000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    networks:
      - g05_network

  frontend:
    build:
      context: ./src/presentation/web
      dockerfile: Dockerfile
    container_name: g05_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    mem_limit: 128m
    cpus: 0.5
    networks:
      - g05_network

volumes:
  postgres_data:

networks:
  g05_network:
    driver: bridge