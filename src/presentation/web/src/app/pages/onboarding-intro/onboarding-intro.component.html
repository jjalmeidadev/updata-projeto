  <section class="content">
    <div class="intro-panel">
      <header class="intro-header">
        <h1>Let’s get your onboarding started</h1>
        <p class="intro-text">
          Welcome! Follow the steps to provide the information the Equiem team needs to set everything up for you.
        </p>
        <p class="intro-text intro-text--secondary">
          Takes about 10–15 minutes to fully complete.
        </p>

      <div class="intro-actions">
        <button type="button" class="start-btn" (click)="start()">

        <p class="intro-feedback" *ngIf="guidanceMessage">{{ guidanceMessage }}</p>
