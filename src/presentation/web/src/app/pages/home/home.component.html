    <div class="profile">
      <button
        type="button"
        class="avatar-btn"
        aria-haspopup="menu"
        [attr.aria-expanded]="profileMenuOpen"
        (click)="toggleProfileMenu($event)"
      >
        <span class="avatar"><span>{{ userInitials$ | async }}</span></span>
      </button>

      <div *ngIf="profileMenuOpen" class="profile-menu" role="menu">
        <div class="profile-menu-header">
          <div class="profile-menu-label">Account</div>
          <div class="profile-menu-email">{{ userEmail$ | async }}</div>
        </div>
        <div class="profile-menu-divider"></div>
        <button type="button" class="logout-btn" role="menuitem" (click)="logout()">
          Logout
        </button>
      </div>
    </div>
  </header>

  <section class="content">
    <div class="home-panel">
      <div class="home-header">
        <h1>Current Onboarding Processes</h1>
        <p class="subtitle">
          Track the progress of all ongoing onboarding flows.
        </p>
      </div>

      <div class="table-wrapper">
        <table class="company-table">
          <thead>
            <tr>
              <th>Company</th>
              <th>Progress</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let company of companies">
              <td class="company-name">
                {{ company.name }}
              </td>
              <td>
                <div class="progress-container">
                  <span class="percent">0%</span>
                  <div class="progress-bar">
                    <div
                      class="progress-fill"
                      [style.width.%]="company.progress"
                    ></div>
                  </div>
                  <span class="percent">100%</span>
                </div>
              </td>
              <td class="status-cell">
                <span
                  class="status-pill"
                  [class.status-started]="company.started"
                  [class.status-not-started]="!company.started"
                >
                  {{ company.started ? 'In progress' : 'Not started' }}
                </span>
              </td>
              <td class="actions-cell">
                <button
                  *ngIf="company.started"
                  class="details-btn"
                  (click)="viewDetails(company)"
                >
                  View details →
                </button>
                <button
                  *ngIf="!company.started"
                  class="start-btn"
                  (click)="startOnboarding(company)"
                >
                  Start Onboarding
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</div>
