<div class="selector-container">
  <svg
    class="background-svg"
    xmlns="http://www.w3.org/2000/svg"
    width="588"
    height="822"
    viewBox="0 0 588 822"
    fill="none"
    aria-hidden="true"
  >
    <g clip-path="url(#clip0_selector_bg)">
      <path
        d="M587.5 655.697V821.5C344.053 821.233 146.773 626.402 146.5 386H314.405C314.678 534.803 436.775 655.431 587.5 655.697Z"
        stroke="#d6c5fb"
      ></path>
      <path
        d="M-127.596 385.5C-127.596 534.533 -5.3938 655.43 145.5 655.697V821.5C-98.116 821.233 -295.5 626.132 -295.5 385.5C-295.5 144.704 -97.8459 -50.5 146 -50.5C389.677 -50.5 587.226 144.433 587.5 385H419.595C419.322 236.032 296.893 115.303 146 115.303C-5.06229 115.303 -127.596 236.302 -127.596 385.5Z"
        stroke="#d6c5fb"
      ></path>
    </g>
    <defs>
      <clipPath id="clip0_selector_bg">
        <rect
          width="884"
          height="873"
          fill="white"
          transform="translate(-296 -51)"
        ></rect>
      </clipPath>
    </defs>
  </svg>

  <section class="content">
    <div class="selector-panel">
      <header class="selector-header">
        <h1>Select sections for this onboarding</h1>
        <p class="subtitle">Only the selected sections will appear in the form.</p>
      </header>

      @if (loading()) {
        <p class="loading">Loading sections…</p>
      } @else {
        <section class="selector-card">
          <div class="actions">
            <button type="button" class="btn-secondary" (click)="selectAll()">Select all</button>
            <button type="button" class="btn-secondary" (click)="clearAll()">Clear all</button>
          </div>

          <div class="section-list">
            @for (section of sections(); track section) {
              <label class="section-item">
                <input
                  type="checkbox"
                  [checked]="isSelected(section)"
                  (change)="toggleSection(section)"
                />
                <span>{{ sectionLabels[section] ?? section }}</span>
              </label>
            }
          </div>

          <div class="footer">
            <button
              type="button"
              class="btn-primary"
              [disabled]="!canContinue()"
              (click)="continueToForm()"
            >
              Continue
            </button>
          </div>
        </section>
      }
    </div>
  </section>
</div>
