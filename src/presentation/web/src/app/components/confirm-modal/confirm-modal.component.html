<div class="modal-overlay" *ngIf="isOpen" (click)="cancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ title }}</h2>
      <button class="close-btn" type="button" (click)="cancel()" [disabled]="isLoading">
        ✕
      </button>
    </div>

    <div class="modal-body">
      <p class="modal-message">{{ message }}</p>
    </div>

    <div class="modal-footer">
      <button
        class="cancel-btn"
        type="button"
        (click)="cancel()"
        [disabled]="isLoading"
      >
        {{ cancelLabel }}
      </button>
      <button
        class="confirm-btn"
        type="button"
        (click)="confirm()"
        [disabled]="isLoading"
        [ngClass]="tone"
      >
        <span *ngIf="!isLoading">{{ confirmLabel }}</span>
        <span *ngIf="isLoading">Processing...</span>
      </button>
    </div>
  </div>
</div>
