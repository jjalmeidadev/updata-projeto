<div class="toast-stack" aria-live="polite" aria-atomic="true">
  @for (toast of toasts(); track toast.id; let i = $index) {
    <div class="toast" [class.toast-success]="toast.type === 'success'" [class.toast-error]="toast.type === 'error'" [class.toast-info]="toast.type === 'info'">
      <div class="toast-icon" aria-hidden="true">
        @switch (toast.type) {
          @case ('success') { ✓ }
          @case ('error') { ! }
          @default { ℹ }
        }
      </div>
      <p class="toast-message">{{ toast.message }}</p>
      <button type="button" class="toast-close" aria-label="Dismiss notification" (click)="dismiss(toast.id)">×</button>
    </div>
  }
</div>
