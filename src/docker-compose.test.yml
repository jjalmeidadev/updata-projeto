name: g05-test

services:
  tests:
    build:
      context: ..
      dockerfile: src/business/docker-file.dev
    env_file:
      - ../config/.env
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/g05_test
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "test"]
    mem_limit: 128m
    cpus: 0.50

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: g05_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data:size=64m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d g05_test"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    cpus: 0.50
