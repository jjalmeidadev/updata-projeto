name: g05-prod

services:
  backend:
    build:
      context: ..
      dockerfile: src/business/docker-file.prod
    env_file:
      - ../config/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/g05}
    expose:
      - "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.50

  frontend:
    build:
      context: ..
      dockerfile: src/presentation/docker-file.prod
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.50

  postgres:
    profiles: ["with-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: g05
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d g05"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.50

volumes:
  postgres_data_prod:
